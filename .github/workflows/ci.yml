name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Shellcheck
        run: shellcheck lc scripts/*.sh
      - name: LeetCode module
        run: ./lc test
      - name: Spring playground
        working-directory: spring/spring-playground
        run: ./mvnw -B -ntp test
